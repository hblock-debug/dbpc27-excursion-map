<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <style>
        html, body {width: 100%; height: 100%; margin: 0; padding: 0;}
        #map {position: absolute; top: 0; bottom: 0; right: 0; left: 0;}
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([19.8900, -155.7800], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var hotelIcon = L.AwesomeMarkers.icon({icon: 'hotel', prefix: 'fa', markerColor: 'red'});
        var waterIcon = L.AwesomeMarkers.icon({icon: 'anchor', prefix: 'fa', markerColor: 'blue'});
        var shipIcon = L.AwesomeMarkers.icon({icon: 'ship', prefix: 'fa', markerColor: 'blue'});
        var landIcon = L.AwesomeMarkers.icon({icon: 'leaf', prefix: 'fa', markerColor: 'green'});
        var cityIcon = L.AwesomeMarkers.icon({icon: 'landmark', prefix: 'fa', markerColor: 'green'});
        var treeIcon = L.AwesomeMarkers.icon({icon: 'tree', prefix: 'fa', markerColor: 'green'});
        var adventureIcon = L.AwesomeMarkers.icon({icon: 'compass', prefix: 'fa', markerColor: 'purple'});
        var csrIcon = L.AwesomeMarkers.icon({icon: 'heart', prefix: 'fa', markerColor: 'orange'});

        var destinations = [
            {name: "Fairmont Orchid", coords: [19.9576, -155.8643], icon: hotelIcon, time: "Origin Point (0 min)", route: null},
            {name: "Mauna Lani, Auberge", coords: [19.9489, -155.8703], icon: hotelIcon, time: "Origin Point (0 min)", route: null},
            {name: "Anaehoʻomalu Bay (A-Bay)", coords: [19.9150, -155.8893], icon: waterIcon, time: "10 min drive (6.2 mi)", route: [[19.9532, -155.8673], [19.9320, -155.8650], [19.9150, -155.8893]], path: "Route: Hwy 19 South → Waikōloa Beach Dr"},
            {name: "Kawaihae Harbor (South)", coords: [20.0360, -155.8290], icon: shipIcon, time: "15 min drive (9.8 mi)", route: [[19.9532, -155.8673], [19.9800, -155.8450], [20.0360, -155.8290]], path: "Route: Hwy 19 North (Queen Kaʻahumanu Hwy)"},
            {name: "Honokōhau Harbor / Kailua Pier", coords: [19.6708, -156.0245], icon: shipIcon, time: "45–50 min drive (26.5 mi)", route: [[19.9532, -155.8673], [19.8569, -155.9234], [19.7289, -156.0578], [19.6708, -156.0245]], path: "Route: Hwy 19 South past KOA Airport → Kealakehe Pkwy"},
            {name: "Keauhou Bay (Fair Wind)", coords: [19.5593, -155.9632], icon: waterIcon, time: "65 min drive (35.1 mi)", route: [[19.9532, -155.8673], [19.8569, -155.9234], [19.6397, -155.9946], [19.5593, -155.9632]], path: "Route: Hwy 19 South → Kuakini Hwy → Kamehameha III Rd"},
            {name: "Kona Sea Salt & Seahorse Farm", coords: [19.7289, -156.0578], icon: landIcon, time: "30 min drive (20.1 mi)", route: [[19.9532, -155.8673], [19.8569, -155.9234], [19.7289, -156.0578]], path: "Route: Hwy 19 South → Makako Bay Dr (NELHA)"},
            {name: "Kailua-Kona Town / Huliheʻe Palace", coords: [19.6397, -155.9946], icon: cityIcon, time: "45–50 min drive (28.4 mi)", route: [[19.9532, -155.8673], [19.8569, -155.9234], [19.6397, -155.9946]], path: "Route: Hwy 19 South → Palani Rd → Aliʻi Dr"},
            {name: "Waimea / Anna Ranch", coords: [20.0225, -155.6664], icon: treeIcon, time: "25–30 min drive (18.5 mi)", route: [[19.9532, -155.8673], [20.0360, -155.8290], [20.0225, -155.6664]], path: "Route: Hwy 19 North → Kawaihae Rd (Hwy 19 Mauka)"},
            {name: "Hāmākua / Hawaiian Vanilla Co.", coords: [20.0465, -155.3725], icon: landIcon, time: "65–70 min drive (42.0 mi)", route: [[19.9532, -155.8673], [20.0225, -155.6664], [20.0150, -155.4050], [20.0465, -155.3725]], path: "Route: Hwy 19 North → Waimea → Hwy 19 East"},
            {name: "Kahua Ranch", coords: [20.1265, -155.7876], icon: adventureIcon, time: "40–45 min drive (24.2 mi)", route: [[19.9532, -155.8673], [20.0360, -155.8290], [20.1265, -155.7876]], path: "Route: Hwy 19 North → Kawaihae → Kohala Mtn Rd (Hwy 250)"},
            {name: "North Kohala Adventure Hub", coords: [20.2405, -155.8340], icon: adventureIcon, time: "50 min drive (32.1 mi)", route: [[19.9532, -155.8673], [20.0360, -155.8290], [20.1265, -155.7876], [20.2405, -155.8340]], path: "Route: Hwy 19 North → Akoni Pule Hwy (Hwy 270)"},
            {name: "Waikōloa Dry Forest", coords: [19.9360, -155.7925], icon: csrIcon, time: "20–25 min drive (12.4 mi)", route: [[19.9532, -155.8673], [19.9320, -155.8650], [19.9360, -155.7925]], path: "Route: Hwy 19 South → Waikōloa Rd Mauka"},
            {name: "Kīholo Bay / Fishpond", coords: [19.8569, -155.9234], icon: csrIcon, time: "15–20 min drive (11.8 mi)", route: [[19.9532, -155.8673], [19.8569, -155.9234]], path: "Route: Hwy 19 South → Kīholo Bay 4WD Turnoff"},
            {name: "Hawaiian Legacy Reforestation", coords: [20.0150, -155.4050], icon: csrIcon, time: "65 min drive (38.5 mi)", route: [[19.9532, -155.8673], [20.0225, -155.6664], [20.0150, -155.4050]], path: "Route: Hwy 19 North → Waimea → Hwy 19 East"}
        ];

        destinations.forEach(function(item) {
            var popupContent = "<b>" + item.name + "</b><br>⏱ " + item.time;
            if (item.path) popupContent += "<br>🗺️ " + item.path;

            L.marker(item.coords, {icon: item.icon})
                .bindPopup(popupContent)
                .addTo(map);

            if (item.route) {
                L.polyline(item.route, {color: '#34495E', weight: 4, opacity: 0.7, dashArray: '6,8'}).addTo(map);
            }
        });
    </script>
</body>
</html>
