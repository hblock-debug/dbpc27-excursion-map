<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <style>
        html, body {width: 100%; height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        #map {position: absolute; top: 0; bottom: 0; right: 0; left: 0;}
        
        /* Control Overlay Styling */
        .controls-overlay {
            position: absolute;
            top: 12px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-btn {
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
        }
        .filter-btn.active {
            background: #2980b9;
            color: white;
            border-color: #2980b9;
        }
        .origin-select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            font-size: 12px;
            font-weight: bold;
        }
        .gmaps-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            background-color: #27ae60;
            color: white !important;
            text-decoration: none;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }
        .gmaps-btn:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="controls-overlay">
        <div>
            <label style="font-size: 11px; font-weight: bold; display: block; color: #7f8c8d;">STARTING ORIGIN:</label>
            <select id="originSelect" class="origin-select" onchange="updateOrigin()">
                <option value="hub">Central Resort Hub</option>
                <option value="fairmont">Fairmont Orchid</option>
                <option value="maunalani">Mauna Lani Auberge</option>
            </select>
        </div>
        <div style="border-left: 1px solid #ccc; height: 30px; margin: 0 4px;"></div>
        <div>
            <label style="font-size: 11px; font-weight: bold; display: block; color: #7f8c8d;">FILTER CATEGORY:</label>
            <button class="filter-btn active" onclick="filterMap('All', this)">All</button>
            <button class="filter-btn" onclick="filterMap('Tier 1 Core', this)">Tier 1 Core</button>
            <button class="filter-btn" onclick="filterMap('Water Excursion', this)">Water</button>
            <button class="filter-btn" onclick="filterMap('Land Excursion', this)">Land</button>
            <button class="filter-btn" onclick="filterMap('Adventure Excursion', this)">Adventure</button>
            <button class="filter-btn" onclick="filterMap('CSR / Give-Back', this)">CSR</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        var map = L.map('map').setView([19.8900, -155.7800], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var hotelIcon = L.AwesomeMarkers.icon({icon: 'hotel', prefix: 'fa', markerColor: 'red'});
        var waterIcon = L.AwesomeMarkers.icon({icon: 'anchor', prefix: 'fa', markerColor: 'blue'});
        var shipIcon = L.AwesomeMarkers.icon({icon: 'ship', prefix: 'fa', markerColor: 'blue'});
        var landIcon = L.AwesomeMarkers.icon({icon: 'leaf', prefix: 'fa', markerColor: 'green'});
        var cityIcon = L.AwesomeMarkers.icon({icon: 'landmark', prefix: 'fa', markerColor: 'green'});
        var treeIcon = L.AwesomeMarkers.icon({icon: 'tree', prefix: 'fa', markerColor: 'green'});
        var adventureIcon = L.AwesomeMarkers.icon({icon: 'compass', prefix: 'fa', markerColor: 'purple'});
        var csrIcon = L.AwesomeMarkers.icon({icon: 'heart', prefix: 'fa', markerColor: 'orange'});

        var origins = {
            "hub": [19.9532, -155.8673],
            "fairmont": [19.9576, -155.8643],
            "maunalani": [19.9489, -155.8703]
        };
        var currentOrigin = origins["hub"];
        var currentRouteLine = null;
        var markerObjects = [];

        var destinations = [
            {name: "Fairmont Orchid", coords: [19.9576, -155.8643], icon: hotelIcon, time: "Host Hotel (Origin)", category: "Host Hotel", tier: "Core", routePoints: [], gmaps: "https://maps.google.com/?q=Fairmont+Orchid"},
            {name: "Mauna Lani, Auberge", coords: [19.9489, -155.8703], icon: hotelIcon, time: "Host Hotel (Origin)", category: "Host Hotel", tier: "Core", routePoints: [], gmaps: "https://maps.google.com/?q=Mauna+Lani+Auberge"},
            {name: "Anaehoʻomalu Bay (A-Bay)", coords: [19.9150, -155.8893], icon: waterIcon, time: "10 min drive (6.2 mi)", category: "Water Excursion", tier: "Tier 1 Core", routePoints: [[19.9320, -155.8650], [19.9150, -155.8893]], path: "Hwy 19 South → Waikōloa Beach Dr", gmaps: "https://maps.google.com/?q=Anaehoomalu+Bay"},
            {name: "Kawaihae Harbor (South)", coords: [20.0360, -155.8290], icon: shipIcon, time: "15 min drive (9.8 mi)", category: "Water Excursion", tier: "Tier 2 Flex", routePoints: [[19.9800, -155.8450], [20.0360, -155.8290]], path: "Hwy 19 North (Queen Kaʻahumanu Hwy)", gmaps: "https://maps.google.com/?q=Kawaihae+Harbor"},
            {name: "Honokōhau Harbor / Kailua Pier", coords: [19.6708, -156.0245], icon: shipIcon, time: "45–50 min drive (26.5 mi)", category: "Water Excursion", tier: "Tier 1 Core", routePoints: [[19.8569, -155.9234], [19.7289, -156.0578], [19.6708, -156.0245]], path: "Hwy 19 South past KOA Airport → Kealakehe Pkwy", gmaps: "https://maps.google.com/?q=Honokohau+Harbor"},
            {name: "Keauhou Bay (Fair Wind)", coords: [19.5593, -155.9632], icon: waterIcon, time: "65 min drive (35.1 mi)", category: "Water Excursion", tier: "Tier 1 Core", routePoints: [[19.8569, -155.9234], [19.6397, -155.9946], [19.5593, -155.9632]], path: "Hwy 19 South → Kuakini Hwy → Kamehameha III Rd", gmaps: "https://maps.google.com/?q=Keauhou+Bay"},
            {name: "Kona Sea Salt & Seahorse Farm", coords: [19.7289, -156.0578], icon: landIcon, time: "30 min drive (20.1 mi)", category: "Land Excursion", tier: "Tier 1 Core", routePoints: [[19.8569, -155.9234], [19.7289, -156.0578]], path: "Hwy 19 South → Makako Bay Dr (NELHA)", gmaps: "https://maps.google.com/?q=Kona+Sea+Salt"},
            {name: "Kailua-Kona Town / Huliheʻe Palace", coords: [19.6397, -155.9946], icon: cityIcon, time: "45–50 min drive (28.4 mi)", category: "Land Excursion", tier: "Tier 1 Core", routePoints: [[19.8569, -155.9234], [19.6397, -155.9946]], path: "Hwy 19 South → Palani Rd → Aliʻi Dr", gmaps: "https://maps.google.com/?q=Hulihee+Palace"},
            {name: "Waimea / Anna Ranch", coords: [20.0225, -155.6664], icon: treeIcon, time: "25–30 min drive (18.5 mi)", category: "Land Excursion", tier: "Tier 2 Flex", routePoints: [[20.0360, -155.8290], [20.0225, -155.6664]], path: "Hwy 19 North → Kawaihae Rd (Hwy 19 Mauka)", gmaps: "https://maps.google.com/?q=Anna+Ranch+Heritage+Center"},
            {name: "Hāmākua / Hawaiian Vanilla Co.", coords: [20.0465, -155.3725], icon: landIcon, time: "65–70 min drive (42.0 mi)", category: "Land Excursion", tier: "Boutique", routePoints: [[20.0225, -155.6664], [20.0150, -155.4050], [20.0465, -155.3725]], path: "Hwy 19 North → Waimea → Hwy 19 East", gmaps: "https://maps.google.com/?q=Hawaiian+Vanilla+Company"},
            {name: "Kahua Ranch", coords: [20.1265, -155.7876], icon: adventureIcon, time: "40–45 min drive (24.2 mi)", category: "Adventure Excursion", tier: "Tier 1 Core", routePoints: [[20.0360, -155.8290], [20.1265, -155.7876]], path: "Hwy 19 North → Kawaihae → Kohala Mtn Rd (Hwy 250)", gmaps: "https://maps.google.com/?q=Kahua+Ranch"},
            {name: "North Kohala Adventure Hub", coords: [20.2405, -155.8340], icon: adventureIcon, time: "50 min drive (32.1 mi)", category: "Adventure Excursion", tier: "Tier 2 Flex", routePoints: [[20.0360, -155.8290], [20.1265, -155.7876], [20.2405, -155.8340]], path: "Hwy 19 North → Akoni Pule Hwy (Hwy 270)", gmaps: "https://maps.google.com/?q=Hawi+Hawaii"},
            {name: "Waikōloa Dry Forest", coords: [19.9360, -155.7925], icon: csrIcon, time: "20–25 min drive (12.4 mi)", category: "CSR / Give-Back", tier: "Tier 1 Core", routePoints: [[19.9320, -155.8650], [19.9360, -155.7925]], path: "Hwy 19 South → Waikōloa Rd Mauka", gmaps: "https://maps.google.com/?q=Waikoloa+Dry+Forest+Initiative"},
            {name: "Kīholo Bay / Fishpond", coords: [19.8569, -155.9234], icon: csrIcon, time: "15–20 min drive (11.8 mi)", category: "CSR / Give-Back", tier: "Tier 1 Core", routePoints: [[19.8569, -155.9234]], path: "Hwy 19 South → Kīholo Bay 4WD Turnoff", gmaps: "https://maps.google.com/?q=Kiholo+Bay"},
            {name: "Hawaiian Legacy Reforestation", coords: [20.0150, -155.4050], icon: csrIcon, time: "65 min drive (38.5 mi)", category: "CSR / Give-Back", tier: "Tier 2 Flex", routePoints: [[20.0225, -155.6664], [20.0150, -155.4050]], path: "Hwy 19 North → Waimea → Hwy 19 East", gmaps: "https://maps.google.com/?q=Hawaiian+Legacy+Reforestation+Initiative"}
        ];

        function renderMarkers() {
            markerObjects.forEach(m => map.removeLayer(m.layer));
            markerObjects = [];

            destinations.forEach(function(item) {
                var popupContent = "<b>" + item.name + "</b><br><small style='color:#7f8c8d; font-weight:bold;'>" + item.tier + "</small><br><br>⏱ " + item.time;
                if (item.path) popupContent += "<br>🗺️ <i>" + item.path + "</i>";
                if (item.gmaps) popupContent += "<br><a href='" + item.gmaps + "' target='_blank' class='gmaps-btn'>📍 Open in Google Maps</a>";

                var marker = L.marker(item.coords, {icon: item.icon}).addTo(map);
                marker.bindPopup(popupContent);

                marker.on('click', function() {
                    if (currentRouteLine) map.removeLayer(currentRouteLine);
                    if (item.routePoints.length > 0) {
                        var fullRoute = [currentOrigin].concat(item.routePoints);
                        currentRouteLine = L.polyline(fullRoute, {
                            color: '#2980b9',
                            weight: 5,
                            opacity: 0.85,
                            dashArray: '8, 8'
                        }).addTo(map);
                    }
                });

                markerObjects.push({ data: item, layer: marker });
            });
        }

        function updateOrigin() {
            var val = document.getElementById("originSelect").value;
            currentOrigin = origins[val];
            if (currentRouteLine) {
                map.removeLayer(currentRouteLine);
                currentRouteLine = null;
            }
        }

        function filterMap(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (currentRouteLine) {
                map.removeLayer(currentRouteLine);
                currentRouteLine = null;
            }

            markerObjects.forEach(obj => {
                if (category === 'All' || obj.data.category === category || obj.data.tier === category) {
                    map.addLayer(obj.layer);
                } else {
                    map.removeLayer(obj.layer);
                }
            });
        }

        map.on('popupclose', function() {
            if (currentRouteLine) {
                map.removeLayer(currentRouteLine);
                currentRouteLine = null;
            }
        });

        renderMarkers();
    </script>
</body>
</html>
